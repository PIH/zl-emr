property.pih.config.default=haiti,haiti-central,haiti-local-idgen

# These override French names for encounter types defined in the parent pihemr-content package's own
# encounterTypes.csv. A content package's content.properties only resolves placeholders within its own
# configuration, so cross-package overrides like this must live here instead, where the SDK's
# build-distro step applies var.* substitutions across every layered content package's files.
# Non-ASCII characters must be written as Java Properties \uXXXX escapes (not literal UTF-8 bytes):
# the build-distro substitution pass reads this file as ISO-8859-1, so literal accented characters
# come out double-UTF-8-encoded (mojibake) in the assembled files, while \uXXXX escapes are decoded
# to the correct Unicode codepoint regardless of stream encoding. Verified empirically by rebuilding
# distro/ with each form and inspecting the assembled encounterTypes.csv at the byte level.
var.encounterType.PATIENT_REGISTRATION.name=Enregistrement de patient
var.encounterType.CHECK_IN.name=Inscription
var.encounterType.MEDICATION_DISPENSED.name=M\u00e9dicaments administr\u00e9s
var.encounterType.VITALS.name=Signes vitaux
